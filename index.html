<style>
:root{
  --cream:#100C08; --card:#1A150E; --ink:#FFF7E6; --ink-soft:#A89C84;
  --teal:#4FA093; --teal-dark:#62B8A9; --mustard:#FFB000; --mustard-dark:#CC8C00;
  --rust:#C85D42; --rust-dark:#E0745A; --blue:#5C8FCB; --blue-dark:#7FAADB; --line:rgba(255,255,255,0.12);
  --hair:rgba(255,255,255,0.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:var(--cream); color:var(--ink); font-family:'Poppins',sans-serif;
  max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:64px; padding-top:98px; position:relative;
}
h1,h2,h3{font-family:'Poppins',sans-serif; font-weight:600; margin:0;}
.topbar{
  position:fixed; top:0; left:50%; transform:translate(-50%,0); width:100%; max-width:480px;
  z-index:8; background:var(--cream);
  padding:0.9rem 1rem 0.6rem; min-height:64px; box-sizing:border-box;
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:0.6rem;}
.topbar h1{font-size:1.5rem;}
.icon-btn{background:none;border:1px solid var(--line);border-radius:20px;padding:0.4rem 0.6rem;cursor:pointer;color:var(--ink);font-size:0.9rem;}
.subtabs-row{display:flex;align-items:center;gap:0.5rem;padding-bottom:0.2rem;}
.subtabs-row .subtabs{display:flex;gap:0.4rem;flex:1;min-width:0;}
.subtabs-row .icon-btn{flex-shrink:0;padding:0.35rem 0.55rem;font-size:0.95rem;}
.subtabs-row input{flex:1;min-width:0;font-family:'Poppins',sans-serif;font-size:0.8rem;padding:0.45rem 0.9rem;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);}
.subtab{flex:0 0 auto;font-family:'Poppins',sans-serif;font-size:0.74rem;padding:0.38rem 0.8rem;background:transparent;border:1px solid var(--line);border-radius:20px;color:var(--ink-soft);cursor:pointer;text-align:center;}
.subtab.active{background:var(--mustard);border-color:var(--mustard);color:#100C08;font-weight:600;}
.searchbar{display:flex;gap:0.5rem;margin-top:0.6rem;}
.searchbar input{flex:1;font-family:'Poppins',sans-serif;font-size:0.8rem;padding:0.5rem 0.9rem;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);}
main{padding:1rem;}
.section-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-soft);margin:1.4rem 0 0.5rem;}
.section-label:first-child{margin-top:0;}
.section-label-strong{font-size:1.05rem;text-transform:none;letter-spacing:0;color:var(--mustard);font-family:'Poppins',sans-serif;font-weight:600;margin:1.3rem 0 0.1rem;scroll-margin-top:100px;}
.section-label-strong:first-child{margin-top:0;}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--ink-soft);font-size:0.8rem;border:1px dashed var(--line);border-radius:14px;}
.empty b{display:block;font-family:'Poppins',sans-serif;font-size:1.05rem;color:var(--ink);font-weight:600;margin-bottom:0.3rem;}

.ep-card{
  display:flex; gap:0.75rem; padding:0.7rem 0; border-bottom:1px solid var(--hair);
  cursor:pointer; position:relative;
}
.ep-card.watchedhist{opacity:0.65;}
.poster{width:54px;height:78px;object-fit:cover;border-radius:10px;background:linear-gradient(160deg,#3A2E1B,#1C150C);flex-shrink:0;}
.ep-info{flex:1;min-width:0;}
.ep-title{font-family:'Poppins',sans-serif;font-weight:600;font-size:0.95rem;margin:0 0 0.15rem;line-height:1.2;color:var(--ink);}
.ep-sub{font-size:0.7rem;color:var(--ink-soft);}
.ep-date{font-size:0.68rem;color:var(--ink-soft);margin-top:0.15rem;}
.chip-row{display:flex;gap:0.3rem;margin-top:0.45rem;flex-wrap:wrap;}
.chip{font-size:0.62rem;padding:0.12rem 0.55rem;border-radius:10px;}
.chip-gold{border:1px solid var(--mustard);color:var(--mustard);}
.chip-outline{border:1px solid rgba(255,255,255,0.2);color:var(--ink-soft);}
.pin-flag{font-size:0.62rem;color:var(--mustard);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;}
.watch-btn{

.date-header{font-size:1rem;font-family:'Poppins',sans-serif;font-weight:600;color:var(--mustard);background:var(--cream);position:sticky;top:var(--topbar-h,98px);padding:0.4rem 0;margin-top:0.9rem;border-bottom:1px solid rgba(255,176,0,0.35);}

.fin-filters{display:flex;gap:0.4rem;margin:0 0 0.3rem;}
.fin-filter{font-family:'Poppins',sans-serif;font-size:0.68rem;padding:0.28rem 0.8rem;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:var(--ink-soft);cursor:pointer;}

.fin-card{display:flex;gap:0.75rem;padding:0.7rem 0;border-bottom:1px solid var(--hair);cursor:pointer;}

.fin-poster{position:relative;flex-shrink:0;}

.fab{

}

@media (min-width:480px){ .fab{ right:calc(50% - 240px + 16px); } }
.bottomnav{
  position:fixed;bottom:0;left:50%;transform:translate(-50%,0);width:100%;max-width:480px;
  display:flex;background:#0B0805;border-top:1px solid rgba(255,255,255,0.07);z-index:7;transition:transform 0.2s ease;

.navbtn{flex:1;background:none;border:none;color:var(--ink-soft);padding:0.5rem 0.1rem 0.45rem;font-family:'Poppins',sans-serif;font-size:0.56rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0.15rem;outline:none;-webkit-tap-highlight-color:transparent;}

.detail-tab{font-family:'Poppins',sans-serif;font-size:0.72rem;padding:0.38rem 0.8rem;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--ink-soft);cursor:pointer;text-align:center;}

.detail-pane{display:none;font-size:0.82rem;line-height:1.6;color:var(--ink-soft);}

.season-block{margin-bottom:0.2rem;}
.season-title{font-family:'Poppins',sans-serif;font-weight:600;font-size:0.95rem;color:var(--ink);}
.season-head{display:flex;justify-content:space-between;align-items:center;gap:0.6rem;padding:0.6rem 0;border-bottom:1px solid var(--hair);cursor:pointer;}
.season-meta{display:flex;align-items:center;gap:0.4rem;font-size:0.68rem;color:var(--ink-soft);}

.season-eps{display:none;padding-bottom:0.4rem;}

.soft-link{background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:0.72rem;text-decoration:underline;cursor:pointer;display:block;margin:0.8rem auto 0;padding:0.3rem;}
.ep-pane-title{font-family:'Poppins',sans-serif;font-weight:600;font-size:0.92rem;color:var(--ink);margin-bottom:0.5rem;}
.ep-row{display:flex;justify-content:space-between;gap:0.6rem;padding:0.45rem 0;border-bottom:1px solid var(--hair);font-size:0.76rem;cursor:pointer;}
.ep-row .name{color:var(--ink);}
.ep-row .st{font-size:0.68rem;flex-shrink:0;}
.ep-row-watch{width:22px;height:22px;border-radius:50%;background:var(--mustard);color:#100C08;border:none;font-size:0.75rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.ep-row-unwatch{width:22px;height:22px;border-radius:50%;background:transparent;color:var(--ink-soft);border:1px solid var(--line);font-size:0.75rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.add-cta{width:100%;margin-top:1rem;font-family:'Poppins',sans-serif;font-weight:600;font-size:0.85rem;padding:0.75rem;background:var(--mustard);color:#100C08;border:none;border-radius:24px;cursor:pointer;}
.add-cta.added{background:var(--teal);cursor:default;}
.field{margin-bottom:0.8rem;}
.field label{display:block;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:0.3rem;}
.field input,.field select,.field textarea{width:100%;font-family:'Poppins',sans-serif;font-size:0.82rem;padding:0.55rem 0.7rem;border:1px solid var(--line);border-radius:10px;background:var(--cream);color:var(--ink);}
.field textarea{min-height:50px;resize:vertical;}
.err{color:var(--rust-dark);font-size:0.7rem;margin-top:0.25rem;display:none;}
.modal-actions{display:flex;justify-content:flex-end;gap:0.6rem;margin-top:1rem;}
.modal-actions button{font-family:'Poppins',sans-serif;font-size:0.78rem;padding:0.5rem 1rem;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--ink);cursor:pointer;}
.modal-actions button.primary{background:var(--mustard);color:#100C08;border-color:var(--mustard);font-weight:600;}
.star-pick{font-size:1.2rem;letter-spacing:3px;cursor:pointer;color:var(--line);}
.star-pick span.on{color:var(--mustard);}

.disc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;}
.disc-item{cursor:pointer;position:relative;}
.disc-item img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:linear-gradient(160deg,#3A2E1B,#1C150C);display:block;}
.disc-item .t{font-size:0.68rem;margin-top:0.3rem;line-height:1.25;color:var(--ink);}
.disc-item .why{font-size:0.58rem;color:var(--mustard);margin-top:0.1rem;line-height:1.2;}
.disc-item .already{position:absolute;top:5px;right:5px;background:var(--teal);color:#100C08;font-size:0.55rem;padding:0.1rem 0.4rem;border-radius:6px;font-weight:600;}
.disc-item .type-badge{position:absolute;top:5px;left:5px;font-size:0.55rem;padding:0.1rem 0.4rem;border-radius:6px;z-index:1;color:#100C08;font-weight:600;}
.badge-serie{background:var(--teal);}
.badge-peli{background:var(--rust);}
.badge-libro{background:var(--mustard);}

.profile-head{display:flex;align-items:center;gap:0.9rem;margin-bottom:1.3rem;}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--mustard);color:#100C08;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:600;font-size:1.4rem;flex-shrink:0;cursor:pointer;}
.profile-name{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.2rem;}
.period-row{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:1.1rem;}
.period-chip{font-family:'Poppins',sans-serif;font-size:0.68rem;padding:0.35rem 0.7rem;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--ink-soft);cursor:pointer;}
.period-chip.active{background:var(--mustard);color:#100C08;border-color:var(--mustard);font-weight:600;}
.stat-card{background:var(--card);border-radius:14px;padding:0.9rem 1rem;margin-bottom:0.6rem;}
.stat-card .label{font-size:0.7rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;}
.stat-card .value{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.4rem;margin-top:0.15rem;color:var(--ink);}
.stat-card .subvalue{font-size:0.74rem;color:var(--ink-soft);margin-top:0.2rem;}
.bar-row{display:flex;align-items:center;gap:0.5rem;font-size:0.7rem;margin:0.3rem 0;}
.bar-row .lbl{width:64px;flex-shrink:0;color:var(--ink-soft);}
.bar-row .val{width:78px;flex-shrink:0;text-align:right;color:var(--ink);}
.vchart-area{display:flex;gap:0.4rem;align-items:flex-end;height:154px;margin-top:0.7rem;border-bottom:1px solid var(--hair);}
.vcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
.vcol-val{font-size:0.58rem;color:var(--ink);margin-bottom:0.25rem;white-space:nowrap;}
.vcol-val.zero{color:var(--ink-soft);}
.vbar{width:70%;max-width:34px;border-radius:5px 5px 2px 2px;background:rgba(255,176,0,0.55);}
.vbar.max{background:var(--mustard);}
.vbar.live{background:repeating-linear-gradient(135deg,rgba(255,176,0,0.55) 0 5px,rgba(255,176,0,0.25) 5px 10px);}
.vcol-lab{font-size:0.6rem;color:var(--ink-soft);margin-top:0.4rem;white-space:nowrap;}
.chart-note{font-size:0.65rem;color:var(--ink-soft);padding:0 0.2rem;margin-bottom:0.6rem;}
.bar-track{flex:1;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;position:relative;overflow:hidden;}
.bar-fill{height:100%;background:var(--mustard);border-radius:4px;}
.forecast-item{display:flex;justify-content:space-between;align-items:baseline;gap:0.6rem;border-bottom:1px solid var(--hair);padding:0.55rem 0;font-size:0.8rem;}
.forecast-item:last-child{border-bottom:none;}
.forecast-item b{color:var(--ink);font-weight:600;}
.fc-left{min-width:0;}
.fc-sub{font-size:0.7rem;color:var(--ink-soft);margin-top:0.15rem;}
.fc-right{flex-shrink:0;text-align:right;color:var(--ink);font-size:0.8rem;}
.fc-right.nodata{color:var(--ink-soft);font-size:0.72rem;}
.loading{text-align:center;padding:2.5rem;color:var(--ink-soft);font-size:0.8rem;}
</style>

<body>

<div class="topbar" id="topbar"></div>
<main id="main"><div class="loading">Abriendo el fichero…</div></main>
<button class="fab" id="fabAdd" title="Añadir manualmente" style="display:none;">+</button>
<div class="bottomnav" id="bottomnav">
  <button class="navbtn active" data-tab="series"><span class="ic"><i class="ti ti-device-tv"></i></span>Series</button>
  <button class="navbtn" data-tab="pelis"><span class="ic"><i class="ti ti-movie"></i></span>Pelis</button>
  <button class="navbtn" data-tab="biblioteca"><span class="ic"><i class="ti ti-book"></i></span>Biblioteca</button>
  <button class="navbtn" data-tab="descubrir"><span class="ic"><i class="ti ti-search"></i></span>Descubrir</button>
  <button class="navbtn" data-tab="perfil"><span class="ic"><i class="ti ti-user"></i></span>Perfil</button>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheetContent"></div></div>
<div class="overlay" id="dateAskOverlay" style="align-items:center;"><div class="sheet" id="dateAskContent" style="max-width:300px;border-radius:12px;"></div></div>

<script>
/* ---------------- STORAGE ---------------- */
let series = [];
let movies = [];
let books = [];
let profile = { name:'Tu perfil', avatar:'' };
let settings = { tmdbKey:'' };

/* ---------------- INDEXEDDB STORAGE ---------------- */
let _dbPromise = null;
function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open('culturicidio_db', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbPromise;
}
async function idbGet(key){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('kv','readonly');
    const r = tx.objectStore('kv').get(key);
    r.onsuccess = ()=> resolve(r.result);
    r.onerror = ()=> reject(r.error);
  });
}
async function idbSet(key, value){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function migrateFromLocalStorageIfNeeded(){
  try{
    const already = await idbGet('migrated_v1');
    if(already) return;
    const keys = ['series','movies','books','profile','settings'];
    for(const k of keys){
      const raw = localStorage.getItem('fichero_'+k);
      if(raw){ try{ await idbSet(k, JSON.parse(raw)); }catch(e){} }
    }
    await idbSet('migrated_v1', true);
  }catch(e){ console.error('Migration failed', e); }
}
async function loadAll(){
  await migrateFromLocalStorageIfNeeded();
  try{ series = (await idbGet('series')) || []; }catch(e){ series=[]; }
  try{ movies = (await idbGet('movies')) || []; }catch(e){ movies=[]; }
  try{ books = (await idbGet('books')) || []; }catch(e){ books=[]; }
  try{ profile = (await idbGet('profile')) || profile; }catch(e){}
  try{ settings = (await idbGet('settings')) || settings; }catch(e){}
  recomputeAll();
  render();
}
function warnStorageFull(e){
  alert('No se ha podido guardar: el almacenamiento está lleno o no disponible.\n\nPrueba a eliminar alguna serie, peli o libro que ya no necesites, o exporta tus datos como copia de seguridad antes de seguir añadiendo más.');
  console.error('Storage save failed', e);
}
async function saveSeries(){ try{ await idbSet('series', series); }catch(e){ warnStorageFull(e); } }
async function saveMovies(){ try{ await idbSet('movies', movies); }catch(e){ warnStorageFull(e); } }
async function saveBooks(){ try{ await idbSet('books', books); }catch(e){ warnStorageFull(e); } }
async function saveProfile(){ try{ await idbSet('profile', profile); }catch(e){ warnStorageFull(e); } }
async function saveSettings(){ try{ await idbSet('settings', settings); }catch(e){ warnStorageFull(e); } }
function storageUsageKB(){
  const total = JSON.stringify(series).length + JSON.stringify(movies).length + JSON.stringify(books).length;
  return Math.round(total/1024);
}

/* ---------------- HELPERS ---------------- */
const todayISO = () => new Date().toISOString().slice(0,10);
function uid(p){ return p+Date.now()+Math.random().toString(36).slice(2,7); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtRelativeDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((dt-today)/86400000);
  if(diffDays===0) return 'Hoy';
  if(diffDays===1) return 'Mañana';
  if(diffDays===-1) return 'Ayer';
  if(diffDays>1 && diffDays<=7){
    const w = dt.toLocaleDateString('es-ES',{weekday:'long'});
    return w.charAt(0).toUpperCase()+w.slice(1);
  }
  return fmtDate(d);
}
function fmtDateTime(ts){ const dt=new Date(ts); return dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short'})+' · '+dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function flatEpisodes(s){
  const out=[];
  (s.seasons||[]).forEach(season=>{
    (season.episodes||[]).forEach(ep=>{
      out.push(Object.assign({season_number:season.season_number}, ep));
    });
  });
  out.sort((a,b)=> (a.air_date||'9999').localeCompare(b.air_date||'9999') || a.episode_number-b.episode_number);
  return out;
}
function airedEpisodes(s){ return flatEpisodes(s).filter(e => e.air_date && e.air_date<=todayISO()); }
function nextEpisodeOf(s){ return airedEpisodes(s).find(e=>!e.watched) || null; }
function lastWatchedOf(s){
  const w = flatEpisodes(s).filter(e=>e.watched && e.watchedAt).sort((a,b)=>b.watchedAt-a.watchedAt);
  return w[0] || null;
}
function hasFutureEpisodes(s){
  if(s.tmdb_status && /returning|in production|planned/i.test(s.tmdb_status)) return true;
  return flatEpisodes(s).some(e=> e.air_date && e.air_date>todayISO());
}
// Estado de una serie finalizada:
//  'known'   -> vuelve y ya hay fecha (hay un capítulo futuro programado)
//  'unknown' -> vuelve (en emisión / en producción) pero sin fecha todavía
//  'ended'   -> terminada o cancelada
function endState(s){
  const future = flatEpisodes(s).filter(e=>e.air_date && e.air_date>todayISO()).map(e=>e.air_date).sort();
  if(future.length) return {state:'known', date:future[0]};
  if(s.tmdb_status && /returning|in production|planned/i.test(s.tmdb_status)) return {state:'unknown', date:null};
  return {state:'ended', date:null};
}
function seriesStatus(s){
  const aired = airedEpisodes(s);
  const watchedAired = aired.filter(e=>e.watched).length;
  if(watchedAired===0) return 'sin_comenzar';
  if(watchedAired < aired.length) return 'en_curso';
  return 'finalizada';
}
function recomputeAll(){
  series.forEach(s=>{
    const status = seriesStatus(s);
    const aired = airedEpisodes(s);
    const watchedAired = aired.filter(e=>e.watched).length;
    if(status==='finalizada'){
      s._wasFinalizada = true;
    } else if(status==='en_curso' && s._wasFinalizada){
      s.pinned = true; s.pinnedAt = s.pinnedAt || Date.now();
      s._wasFinalizada = false;
    }
    s._status = status;
  });
}
function clearAllPins(){ series.forEach(s=>{ s.pinned=false; }); }

async function markEpisodeWatched(seriesId, seasonNum, epNum){
  const s = series.find(x=>x.id===seriesId); if(!s) return;
  const season = s.seasons.find(sn=>sn.season_number===seasonNum); if(!season) return;
  const ep = season.episodes.find(e=>e.episode_number===epNum); if(!ep) return;
  ep.watched = true; ep.watchedAt = Date.now();
  clearAllPins();
  recomputeAll();
  await saveSeries();
  render();
}
async function markWatchedThrough(seriesId, seasonNum, epNum, atValue){
  const s = series.find(x=>x.id===seriesId); if(!s) return;
  const target = flatEpisodes(s).find(e=>e.season_number===seasonNum && e.episode_number===epNum);
  if(!target) return;
  const useNow = atValue===undefined;
  const base = useNow ? Date.now() : atValue;
  let offset = 0;
  flatEpisodes(s).forEach(fe=>{
    const isTargetOrBefore = (fe.air_date||'').localeCompare(target.air_date||'')<0 ||
      (fe.season_number<seasonNum) || (fe.season_number===seasonNum && fe.episode_number<=epNum);
    if(isTargetOrBefore && !fe.watched){
      const season = s.seasons.find(sn=>sn.season_number===fe.season_number);
      const ep = season.episodes.find(e=>e.episode_number===fe.episode_number);
      ep.watched = true;
      ep.watchedAt = (base===null) ? null : base + offset;
      offset++;
    }
  });
  clearAllPins();
  recomputeAll();
  await saveSeries();
  render();
}
async function unmarkEpisodeWatched(seriesId, seasonNum, epNum){
  const s = series.find(x=>x.id===seriesId); if(!s) return;
  const season = s.seasons.find(sn=>sn.season_number===seasonNum); if(!season) return;
  const ep = season.episodes.find(e=>e.episode_number===epNum); if(!ep) return;
  ep.watched = false; ep.watchedAt = null;
  recomputeAll();
  await saveSeries();
  render();
}
async function markSeasonWatched(seriesId, seasonNum){
  const s = series.find(x=>x.id===seriesId); if(!s) return;
  const season = s.seasons.find(sn=>sn.season_number===seasonNum); if(!season) return;
  const lastEp = season.episodes[season.episodes.length-1];
  if(!lastEp) return;
  await markWatchedThrough(seriesId, seasonNum, lastEp.episode_number);
}

const IMG = 'https://image.tmdb.org/t/p/w300';
async function tmdb(path, params){
  if(!settings.tmdbKey) throw new Error('no-key');
  const url = new URL('https://api.themoviedb.org/3/'+path);
  url.searchParams.set('api_key', settings.tmdbKey);
  url.searchParams.set('language','es-ES');
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url);
  if(!res.ok) throw new Error('tmdb-error');
  return res.json();
}
async function tmdbSearchMulti(q){ const d = await tmdb('search/multi',{query:q}); return (d.results||[]).filter(r=>r.media_type==='tv'||r.media_type==='movie'); }
async function tmdbPopular(type){ const d = await tmdb(type+'/popular',{}); return d.results||[]; }
async function tmdbUpcomingMovies(){ const d = await tmdb('movie/upcoming',{}); return d.results||[]; }
async function tmdbOnAir(){ const d = await tmdb('tv/on_the_air',{}); return d.results||[]; }
async function tmdbTvDetail(id){ return tmdb('tv/'+id,{append_to_response:'credits'}); }
async function tmdbMovieDetail(id){ return tmdb('movie/'+id,{append_to_response:'credits'}); }
async function tmdbSeason(id, num){ return tmdb('tv/'+id+'/season/'+num,{}); }

// ---- Open Library (respaldo, sin clave): se convierte al mismo formato que Google Books
const olCache = {};
function olToGoogleShape(doc){
  const id = 'ol:' + String(doc.key||'').replace('/works/','');
  const item = { id, volumeInfo:{
    title: doc.title,
    authors: doc.author_name || [],
    imageLinks: doc.cover_i ? {thumbnail:'https://covers.openlibrary.org/b/id/'+doc.cover_i+'-M.jpg'} : undefined,
    pageCount: doc.number_of_pages_median || null,
    publishedDate: doc.first_publish_year ? String(doc.first_publish_year) : '',
    categories: (doc.subject && doc.subject[0]) ? [doc.subject[0]] : undefined
  }};
  olCache[id] = item;
  return item;
}
async function olSearch(q){
  const res = await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=15&fields=key,title,author_name,cover_i,first_publish_year,number_of_pages_median,subject');
  if(!res.ok) throw new Error('ol-error');
  const d = await res.json();
  return (d.docs||[]).filter(x=>x.key && x.title).map(olToGoogleShape);
}
async function gbSearch(q){
  let items = [];
  try{
    const res = await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=15');
    if(res.ok){ const d = await res.json(); items = d.items || []; }
  }catch(e){}
  if(items.length===0){
    try{ items = await olSearch(q); }catch(e){}
  }
  return items;
}
async function gbDetail(id){
  if(String(id).startsWith('ol:')){
    const base = olCache[id] || {id, volumeInfo:{title:'', authors:[]}};
    const info = Object.assign({}, base.volumeInfo);
    try{
      const res = await fetch('https://openlibrary.org/works/'+String(id).slice(3)+'.json');
      if(res.ok){
        const w = await res.json();
        info.description = typeof w.description==='string' ? w.description : ((w.description && w.description.value) || '');
        if(!info.title) info.title = w.title || '';
      }
    }catch(e){}
    return {id, volumeInfo:info};
  }
  const res = await fetch('https://www.googleapis.com/books/v1/volumes/'+id);
  if(!res.ok) throw new Error('gb-error');
  return res.json();
}
async function addBookFromGoogle(gbId){
  if(books.some(b=>b.gbId===gbId)) return;
  const d = await gbDetail(gbId);
  const info = d.volumeInfo || {};
  books.push({
    id: uid('b_'), gbId, title: info.title||'Sin título',
    author: (info.authors||[]).join(', '),
    cover: info.imageLinks? (info.imageLinks.thumbnail||info.imageLinks.smallThumbnail||'').replace('http://','https://') : '',
    overview: info.description||'', pages: info.pageCount||null,
    publishedDate: info.publishedDate||'', watched:false, watchedAt:null, addedAt:Date.now()
  });
  await saveBooks();
}

function renderSeriesTab(){
  const main = document.getElementById('main');
  const q = searchQuery.series.toLowerCase();
  if(seriesSub==='pendientes'){
    let list = series;
    if(q) list = list.filter(s=>s.title.toLowerCase().includes(q));
    const pinned = list.filter(s=>s._status==='en_curso' && s.pinned).sort((a,b)=>(b.pinnedAt||0)-(a.pinnedAt||0));
    const curso = list.filter(s=>s._status==='en_curso' && !s.pinned).sort((a,b)=>{
      const la=lastWatchedOf(a), lb=lastWatchedOf(b);
      return (lb?.watchedAt||0)-(la?.watchedAt||0);
    });
    const sinComenzar = list.filter(s=>s._status==='sin_comenzar').sort((a,b)=>b.addedAt-a.addedAt);
    const watchedFlat = [];
    series.forEach(s=> flatEpisodes(s).filter(e=>e.watched && e.watchedAt).forEach(e=> watchedFlat.push({s,e})));
    watchedFlat.sort((a,b)=>b.e.watchedAt-a.e.watchedAt);

    let html = '';
    if(watchedFlat.length){
      html += `<div class="section-label">Vistos · desliza hacia arriba</div>`;
      html += watchedFlat.slice(0,60).reverse().map(({s,e})=>epCardHtml(s,e,'watchedhist',true)).join('');
    }
    html += `<div class="section-label-strong" id="viendoAnchor">Viendo</div>`;
    if(pinned.length+curso.length===0){
      html += `<div class="empty"><b>Nada en curso</b>Añade una serie o marca un capítulo para empezar.</div>`;
    } else {
      html += pinned.map(s=>{ const ep=nextEpisodeOf(s); return ep? epCardHtml(s,ep,'pinned',false,true,false,true):''; }).join('');
      html += curso.map(s=>{ const ep=nextEpisodeOf(s); return ep? epCardHtml(s,ep,'',false,false,false,true):''; }).join('');
    }
    html += `<div class="section-label-strong">Sin comenzar</div>`;
    if(sinComenzar.length===0){ html += `<div class="empty">No tienes series sin empezar.</div>`; }
    else html += sinComenzar.map(s=>{ const ep=nextEpisodeOf(s)||flatEpisodes(s)[0]; return ep? epCardHtml(s,ep,'notstarted',false,false,false,true):''; }).join('');
    main.innerHTML = html;
    if(watchedFlat.length){
      setTimeout(()=>{ document.getElementById('viendoAnchor')?.scrollIntoView({block:'start'}); }, 0);
    } else {
      window.scrollTo(0,0);
    }
    bindEpCards();
  } else if(seriesSub==='estrenos'){
    const cutoff = new Date(Date.now()-7*86400000).toISOString().slice(0,10);
    const all = [];
    series.forEach(s=> flatEpisodes(s).filter(e=>e.air_date && e.air_date>=cutoff).forEach(e=> all.push({s,e})));
    all.sort((a,b)=> (a.e.air_date||'').localeCompare(b.e.air_date||''));
    if(all.length===0){ main.innerHTML = `<div class="empty"><b>Sin estrenos</b>Añade series en Descubrir para ver aquí sus próximos capítulos.</div>`; return; }
    let html=''; let lastDate='';

      if(e.air_date!==lastDate){ html+=`<div class="date-header" data-date="${e.air_date||''}">${fmtRelativeDate(e.air_date)}</div>`; lastDate=e.air_date; }
      html += epCardHtml(s,e,'',false,false,true);
    });
    main.innerHTML = html;
    bindEpCards();
    requestAnimationFrame(()=>{
      const headers = [...main.querySelectorAll('.date-header')];
      const target = headers.find(h=> h.dataset.date >= todayISO()) || headers[headers.length-1];
      if(target){
        const y = target.getBoundingClientRect().top + window.scrollY;
        const offset = document.getElementById('topbar').offsetHeight + 4;
        window.scrollTo(0, Math.max(0, y - offset));
      }
    });
  } else {
    let list = series.filter(s=>s._status==='finalizada');
    if(q) list = list.filter(s=>s.title.toLowerCase().includes(q));
    list.sort((a,b)=>{
      const va = (lastWatchedOf(a)?.watchedAt) || a.addedAt || 0;
      const vb = (lastWatchedOf(b)?.watchedAt) || b.addedAt || 0;
      return vb-va;
    });
    const withState = list.map(s=>({s, es:endState(s)}));
    const shown = withState.filter(x=> finFilter==='todas' ? true : finFilter==='terminadas' ? x.es.state==='ended' : x.es.state!=='ended');

    const MARK = {ended:{ic:'check', cls:'st-ended', txt:()=>'Terminada'},

function remainingChips(s, ep){

  );
  const seasons = new Set(left.map(e=>e.season_number)).size;
  return {total:left.length, seasons};
}
function chipsHtml(s, e, withSeasons){
  const c = remainingChips(s, e);
  let html = `<div class="chip-row"><span class="chip chip-gold">${c.total} capítulo${c.total===1?'':'s'} restante${c.total===1?'':'s'}</span>`;
  if(withSeasons) html += `<span class="chip chip-outline">${c.seasons} temporada${c.seasons===1?'':'s'} restante${c.seasons===1?'':'s'}</span>`;

// Duración de los capítulos; avisa si entre temporadas hay >= 10 min de diferencia media
function runtimeSummary(seasons){
  const avgs = (seasons||[]).filter(sn=>sn.season_number>0).map(sn=>{
    const r = (sn.episodes||[]).map(e=>e.runtime).filter(x=>x>0);
    return r.length ? {n:sn.season_number, avg:r.reduce((a,b)=>a+b,0)/r.length} : null;
  }).filter(Boolean);
  if(!avgs.length) return '';
  const segs = [];
  avgs.forEach(a=>{
    const cur = segs[segs.length-1];
    if(cur && Math.abs(a.avg-cur.sum/cur.k)<10){ cur.sum+=a.avg; cur.k++; cur.to=a.n; return; }
    segs.push({from:a.n, to:a.n, sum:a.avg, k:1});
  });
  const st = 'font-size:0.78rem;margin-top:0.4rem;';
  if(segs.length===1) return `<p style="${st}"><b style="color:var(--ink);">Duración de los capítulos:</b> ~${Math.round(segs[0].sum/segs[0].k)} min</p>`;
  return `<p style="${st}"><b style="color:var(--ink);">Duración de los capítulos:</b> varía según la temporada<br>`
    + segs.map(g=>`${g.from===g.to?'Temporada '+g.from:'Temporadas '+g.from+'–'+g.to}: ~${Math.round(g.sum/g.k)} min`).join('<br>') + `</p>`;
}

function normTmdb(r){
  const type = r.media_type || (r.title? 'movie':'tv');
  return { id:r.id, type, title:r.title||r.name, poster: r.poster_path? IMG+r.poster_path:'' };
}
function sortByMatch(items, query){
  const q = query.trim().toLowerCase();
  const scored = items.map((item, idx)=>{
    const t = (item.title||'').trim().toLowerCase();
    let score = 3;
    if(t===q) score = 0;
    else if(t.startsWith(q)) score = 1;
    else if(t.includes(q)) score = 2;
    return Object.assign({}, item, {_matchScore:score, _origIdx:idx});
  });
  scored.sort((a,b)=> a._matchScore-b._matchScore || a._origIdx-b._origIdx);
  return scored;
}
function normBook(item){
  const info = item.volumeInfo || {};
  const cover = info.imageLinks? (info.imageLinks.thumbnail||info.imageLinks.smallThumbnail||'').replace('http://','https://') : '';
  return { id:item.id, type:'book', title:info.title||'Sin título', poster:cover };
}

// ---- Géneros y plataformas guardados en cada serie/peli (se completan solos para lo ya añadido)
function providerNames(p){
  if(!p) return [];
  const g = p.flatrate || p.ads || p.free || [];
  return g.map(x=>x.provider_name);
}
let enrichRunning = false, enrichDone = false, enrichPending = 0;
async function enrichItem(kind, it){
  if(!it.tmdbId) return false;
  let changed = false;
  if(it.genres===undefined){
    const d = await tmdb(kind+'/'+it.tmdbId, {});
    it.genres = (d.genres||[]).map(g=>g.name);
    changed = true;
  }
  if(kind==='tv' && it.providers===undefined){
    const p = await tmdbProviders('tv', it.tmdbId);
    it.providers = providerNames(p);
    changed = true;
  }
  return changed;
}
async function enrichAll(){
  if(enrichRunning || enrichDone || !settings.tmdbKey) return;
  const todo = [];
  series.forEach(s=>{ if(s.tmdbId && (s.genres===undefined || s.providers===undefined)) todo.push(['tv',s]); });
  movies.forEach(m=>{ if(m.tmdbId && m.genres===undefined) todo.push(['movie',m]); });
  if(!todo.length){ enrichDone = true; return; }
  enrichRunning = true; enrichPending = todo.length;
  let anyChange = false;
  for(let i=0;i<todo.length;i+=5){
    const batch = todo.slice(i,i+5);
    const res = await Promise.all(batch.map(([k,it])=> enrichItem(k,it).catch(()=>false)));
    if(res.some(Boolean)) anyChange = true;
    enrichPending = Math.max(0, todo.length-(i+5));
  }
  enrichRunning = false; enrichDone = true; enrichPending = 0;
  if(anyChange){ await saveSeries(); await saveMovies(); }
  if(activeTab==='perfil') renderPerfil();
}

// ---- Gráfico de pizza (SVG) con el número dentro de cada porción
const PIE_COLORS = ['#FFB000','#3DDC84','#4DA3FF','#FF6B6B','#B084FF','#FF8A3D','#2EC4B6','#8A7F6A'];
function pieCard(title, subtitle, entries){
  const total = entries.reduce((a,e)=>a+e[1],0);
  const head = `<div class="label">${title}</div>${subtitle?`<div class="subvalue" style="margin-top:0.1rem;">${subtitle}</div>`:''}`;
  if(!total) return `<div class="stat-card">${head}<div class="subvalue" style="margin-top:0.6rem;">Sin datos en este periodo.</div></div>`;
  let data = entries.slice().sort((a,b)=>b[1]-a[1]);
  if(data.length>8){
    const rest = data.slice(7).reduce((a,e)=>a+e[1],0);
    data = data.slice(0,7).concat([['Otros',rest]]);
  }
  const cx=100, cy=100, r=92;
  let svg = `<svg viewBox="0 0 200 200" style="width:200px;height:200px;display:block;margin:0.7rem auto 0.4rem;">`;
  if(data.length===1){
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PIE_COLORS[0]}"/>`;
    svg += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-family="Poppins,sans-serif" font-weight="700" font-size="26" fill="#100C08">${data[0][1]}</text>`;
  } else {
    let ang = -Math.PI/2;
    data.forEach(([name,n],i)=>{
      const frac = n/total, a2 = ang + frac*2*Math.PI;
      const x1 = cx+r*Math.cos(ang), y1 = cy+r*Math.sin(ang), x2 = cx+r*Math.cos(a2), y2 = cy+r*Math.sin(a2);
      const large = frac>0.5 ? 1 : 0;
      const col = name==='Otros' ? PIE_COLORS[7] : PIE_COLORS[i%7];
      svg += `<path d="M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${col}" stroke="#1A150E" stroke-width="2"/>`;
      if(frac>=0.06){
        const mid = (ang+a2)/2, lr = r*0.62;
        svg += `<text x="${(cx+lr*Math.cos(mid)).toFixed(2)}" y="${(cy+lr*Math.sin(mid)).toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-family="Poppins,sans-serif" font-weight="700" font-size="16" fill="#100C08">${n}</text>`;
      }
      ang = a2;
    });
  }
  svg += `</svg>`;
  const legend = data.map(([name,n],i)=>{
    const col = name==='Otros' ? PIE_COLORS[7] : PIE_COLORS[i%7];
    return `<div class="forecast-item"><div class="fc-left" style="display:flex;align-items:center;gap:0.5rem;"><span style="width:10px;height:10px;border-radius:50%;background:${col};flex:none;"></span><b>${esc(name)}</b></div><div class="fc-right">${n} · ${Math.round(n/total*100)}%</div></div>`;
  }).join('');
  return `<div class="stat-card">${head}${svg}${legend}</div>`;
}

// ---- Estadísticas de plataformas y géneros (respetan el filtro de periodo)
function seriesActiveIn(s, cutoff){
  return flatEpisodes(s).some(e=> e.watched && (e.watchedAt ? e.watchedAt>=cutoff : cutoff===0));
}
function platformCounts(cutoff){
  const m = {};
  series.forEach(s=>{
    if(!seriesActiveIn(s, cutoff)) return;
    const name = (s.providers && s.providers[0]) || 'Sin plataforma';
    m[name] = (m[name]||0)+1;
  });
  return Object.entries(m);
}
function genreCounts(cutoff){
  const m = {};
  const add = list => (list||[]).forEach(g=>{ m[g] = (m[g]||0)+1; });
  series.forEach(s=>{ if(seriesActiveIn(s, cutoff)) add(s.genres); });
  movies.forEach(mv=>{ if(mv.watched && (mv.watchedAt ? mv.watchedAt>=cutoff : cutoff===0)) add(mv.genres); });
  return Object.entries(m);
}

// ---- Maratones: máximo tiempo visto de una serie en cualquier ventana de 24 h (últimos 6 meses)
function marathonFor(s, cutoff){
  const evs = flatEpisodes(s).filter(e=>e.watched && e.watchedAt && e.watchedAt>=cutoff)
    .map(e=>({t:e.watchedAt, m:e.runtime||30})).sort((a,b)=>a.t-b.t);
  let best = 0, j = 0, sum = 0;
  for(let i=0;i<evs.length;i++){
    sum += evs[i].m;
    while(evs[i].t - evs[j].t >= 86400000){ sum -= evs[j].m; j++; }
    if(sum>best) best = sum;
  }
  return best;
}

function normTxt(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function stemOf(w){ return w.slice(0,6); }
function tokens(text){
  const out = [];
  normTxt(text).split(/[^a-z0-9]+/).forEach(w=>{ if(w.length>=4 && !STOP_ES.has(w) && !/^\d+$/.test(w)) out.push(stemOf(w)); });
  return out;
}
// Palabras clave de una sinopsis (sin nombres propios) para buscar libros u otros títulos
function keywordsOf(text, n){
  const cnt = {}, surf = {};
  const re = /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{5,}/g; let m;
  const src = String(text||'');
  while((m = re.exec(src))){
    const w = m[0];
    const prev = src.slice(0,m.index).trim().slice(-1);
    const isCap = w[0]===w[0].toUpperCase() && w[0]!==w[0].toLowerCase();
    if(isCap && prev && !'.!?¿¡:"«'.includes(prev)) continue;   // nombre propio
    const nw = normTxt(w);
    if(STOP_ES.has(nw)) continue;
    const st = stemOf(nw);
    cnt[st] = (cnt[st]||0)+1; if(!surf[st]) surf[st] = w.toLowerCase();
  }
  return Object.keys(cnt).sort((a,b)=> (cnt[b]*3+b.length) - (cnt[a]*3+a.length)).slice(0,n).map(k=>surf[k]);
}
function tfidfSims(seedText, texts){
  const docs = [tokens(seedText)].concat(texts.map(tokens));
  const df = {};
  docs.forEach(d=>{ new Set(d).forEach(t=>{ df[t] = (df[t]||0)+1; }); });
  const N = docs.length;
  const vec = d=>{
    const tf = {}; d.forEach(t=>{ tf[t]=(tf[t]||0)+1; });
    const v = {}; let norm = 0;
    Object.keys(tf).forEach(t=>{ const w = (1+Math.log(tf[t]))*Math.log(1+N/df[t]); v[t]=w; norm += w*w; });
    return {v, norm:Math.sqrt(norm)};
  };
  const sv = vec(docs[0]);
  return docs.slice(1).map(d=>{
    if(!d.length || !sv.norm) return 0;
    const cv = vec(d); let dot = 0;
    Object.keys(cv.v).forEach(t=>{ if(sv.v[t]) dot += sv.v[t]*cv.v[t]; });
    return dot/(sv.norm*cv.norm||1);
  });
}
// Géneros comparables entre series, pelis y libros: "Ciencia ficción y fantasía" -> {ciencia ficcion, fantasia}
const CAT_EN_ES = {'science fiction':'ciencia ficcion','fantasy':'fantasia','mystery':'misterio','crime':'crimen','detective':'crimen','thriller':'suspense','suspense':'suspense','horror':'terror','romance':'romance','history':'historia','historical':'historia','war':'belica','comedy':'comedia','humor':'comedia','adventure':'aventura','action':'accion','drama':'drama','family':'familia','biography':'documental','western':'western','music':'musica','animation':'animacion'};
function genreParts(name){
  const n = normTxt(name);
  const parts = new Set();
  n.split(/ y | & |, | \/ /).forEach(p=>{ p = p.trim(); if(p) parts.add(p); });
  Object.keys(CAT_EN_ES).forEach(k=>{ if(n.includes(k)) parts.add(CAT_EN_ES[k]); });
  if(n==='suspense' || n==='thriller') { parts.add('suspense'); }
  return parts;
}
function partsOfList(list){ const s = new Set(); (list||[]).forEach(g=>genreParts(g).forEach(p=>s.add(p))); return s; }
function diceSets(a,b){
  if(!a.size || !b.size) return 0;
  let inter = 0; a.forEach(x=>{ if(b.has(x)) inter++; });
  return 2*inter/(a.size+b.size);
}

}

// seed = {type:'tv'|'movie'|'book', id, overview, genres:[nombres], cast:[nombres], runtime, authors:[], pages}
async function buildRecommendations(seed, maps){
  const owned = it => it.type==='tv' ? series.some(s=>s.tmdbId===it.id) : it.type==='movie' ? movies.some(m=>m.tmdbId===it.id) : books.some(b=>b.gbId===it.id);
  const seedParts = partsOfList(seed.genres);
  const kws = keywordsOf(seed.overview, 6);
  const pool = {};
  const addTmdb = (type, list)=>{
    (list||[]).forEach(r=>{
      if(!r || !r.poster_path || !r.id) return;
      const key = type+':'+r.id; if(pool[key]) return;
      const names = (r.genre_ids||[]).map(g=>maps[type][g]).filter(Boolean);
      pool[key] = {type, id:r.id, title:r.title||r.name, poster:IMG+r.poster_path, overview:r.overview||'', genres:names,
        quality:(r.vote_count>=100? Math.min(1,(r.vote_average||0)/10):0)};
    });
  };
  const jobs = [];
  if(settings.tmdbKey){
    const other = seed.type==='tv' ? 'movie' : 'tv';
    if(seed.type==='tv' || seed.type==='movie'){
      const own = seed.type;
      jobs.push(tmdb(own+'/'+seed.id+'/recommendations',{}).then(d=>addTmdb(own,d.results)).catch(()=>{}));
      jobs.push(tmdb(own+'/'+seed.id+'/similar',{}).then(d=>addTmdb(own,d.results)).catch(()=>{}));
    }
    const types = seed.type==='book' ? ['tv','movie'] : [seed.type, other];
    types.forEach(t=>{
      const ids = idsForParts(maps, t, seedParts).slice(0,2);
      if(ids.length){
        jobs.push(tmdb('discover/'+t,{with_genres:ids.join(','), sort_by:'vote_count.desc', 'vote_count.gte':300}).then(d=>addTmdb(t,d.results)).catch(()=>{}));
        jobs.push(tmdb('discover/'+t,{with_genres:ids.join('|'), sort_by:'popularity.desc', 'vote_count.gte':100}).then(d=>addTmdb(t,d.results)).catch(()=>{}));
      }
      if(seed.type==='book' && kws.length){
        jobs.push(tmdb('search/'+t,{query:kws.slice(0,2).join(' ')}).then(d=>addTmdb(t,d.results)).catch(()=>{}));
      }
    });
  }
  // Libros: buscados con las palabras clave de la sinopsis (no con el título)
  const bookPool = [];
  const catWord = seed.genres && seed.genres[0] ? genreParts(seed.genres[0]).values().next().value : '';
  const gbJobs = [];
  if(kws.length>=2) gbJobs.push(gbQuery(kws.slice(0,4).join(' ')));
  if(kws.length>=1) gbJobs.push(gbQuery((catWord?catWord+' ':'')+kws.slice(0,2).join(' ')));
  if(seed.type==='book' && seed.authors && seed.authors[0]) gbJobs.push(gbQuery('inauthor:"'+seed.authors[0]+'"'));
  jobs.push(Promise.all(gbJobs).then(lists=>{
    lists.forEach(items=>{
      items.forEach((it,idx)=>{
        const info = it.volumeInfo||{};
        const cover = info.imageLinks ? (info.imageLinks.thumbnail||info.imageLinks.smallThumbnail||'').replace('http://','https://') : '';
        if(!cover) return;
        if(bookPool.some(b=>b.id===it.id)) return;
        if(seed.type==='book' && seed.id===it.id) return;
        bookPool.push({type:'book', id:it.id, title:info.title||'Sin título', poster:cover, overview:(info.description||'').replace(/<[^>]+>/g,''),
          genres:info.categories||[], authors:info.authors||[], pages:info.pageCount||0, rel:1-idx/Math.max(items.length,1), quality:0});
      });
    });
  }).catch(()=>{}));
  await Promise.all(jobs);
  bookPool.forEach(b=>{ pool['book:'+b.id] = b; });

  let cands = Object.values(pool).filter(c=> !(c.type===seed.type && c.id===seed.id) && !owned(c));
  if(!cands.length) return [];
  const sims = tfidfSims(seed.overview||'', cands.map(c=>c.overview));
  cands.forEach((c,i)=>{
    c.text = sims[i];
    c.genre = diceSets(seedParts, partsOfList(c.genres));
    c.cast = 0; c.rt = 0; c.sharedCast = [];
    const relW = c.type!=='book' ? 0 : ((c.text>0||c.genre>0) ? 0.10 : (c.overview ? 0 : 0.06));
    c.score = 0.40*c.text + 0.27*c.genre + 0.07*c.quality + relW*(c.rel||0);
    if(seed.type==='book' && c.type==='book' && seed.authors && c.authors && c.authors.some(a=>seed.authors.includes(a))){ c.cast = 1; c.score += 0.13; }
  });
  cands.sort((a,b)=>b.score-a.score);
  // Segunda fase: reparto y duración de los mejores candidatos de TMDB
  const seedCast = new Set((seed.cast||[]).map(normTxt));
  const top = cands.slice(0,14).filter(c=>c.type!=='book');
  await Promise.all(top.map(async c=>{
    try{
      const d = c.type==='tv' ? await tmdbTvDetail(c.id) : await tmdbMovieDetail(c.id);
      const names = (d.credits&&d.credits.cast||[]).slice(0,10).map(x=>x.name);
      c.sharedCast = names.filter(n=>seedCast.has(normTxt(n)));
      c.cast = Math.min(c.sharedCast.length/2,1);
      const rt = c.type==='tv' ? ((d.episode_run_time&&d.episode_run_time[0]) || (d.last_episode_to_air&&d.last_episode_to_air.runtime) || 0) : (d.runtime||0);
      if(c.type===seed.type && seed.runtime && rt) c.rt = 1-Math.min(Math.abs(rt-seed.runtime)/Math.max(rt,seed.runtime),1);
      if(!c.genres.length && d.genres) c.genres = d.genres.map(g=>g.name);
      c.score = 0.40*c.text + 0.27*diceSets(seedParts, partsOfList(c.genres)) + 0.13*c.cast + 0.08*c.rt + 0.07*c.quality;
    }catch(e){}
  }));
  cands.sort((a,b)=>b.score-a.score);
  // Mezcla de tipos: como mucho 4 de cada
  const out = [], per = {tv:0,movie:0,book:0};
  cands.forEach(c=>{ if(out.length<9 && per[c.type]<4 && c.score>0.08){ out.push(c); per[c.type]++; } });
  cands.forEach(c=>{ if(out.length<9 && !out.includes(c) && c.score>0.08) out.push(c); });
  out.forEach(c=>{
    const why = [];
    const shared = []; const sp = seedParts;
    (c.genres||[]).forEach(g=>{ genreParts(g).forEach(p=>{ if(sp.has(p) && !shared.includes(g)) shared.push(g); }); });
    if(shared.length) why.push(shared.slice(0,2).join(', '));
    if(c.sharedCast && c.sharedCast.length) why.push(c.sharedCast[0]);
    c.why = why.join(' · ');
  });
  return out;
}

const PERIODS = {siempre:null, '1y':365, '6m':182, '1m':30, '2w':14, '1w':7};

function cutoffFor(period){ const days=PERIODS[period]; if(!days) return 0; return Date.now()-days*86400000; }

function allWatchedEvents(cutoff){
  const out=[];
  series.forEach(s=> flatEpisodes(s).forEach(e=>{ if(e.watched && e.watchedAt && e.watchedAt>=cutoff) out.push({watchedAt:e.watchedAt, minutes:e.runtime||30}); }));

function forecastFor(s){
  const cutoff = Date.now()-182*86400000;
  const watched6m = flatEpisodes(s).filter(e=>e.watched && e.watchedAt && e.watchedAt>=cutoff);
  const minutesWatched = watched6m.reduce((a,e)=>a+(e.runtime||30),0);
  const remaining = airedEpisodes(s).filter(e=>!e.watched);
  const minutesRemaining = remaining.reduce((a,e)=>a+(e.runtime||30),0);
  if(watched6m.length===0 || minutesWatched===0) return {days:null, episodesRemaining:remaining.length, minutesRemaining};
  const days = minutesRemaining / (minutesWatched/182);
  return {days, episodesRemaining:remaining.length, minutesRemaining};
}

function fmtDurationMin(totalMin){
  totalMin = Math.max(0, Math.round(totalMin));
  const MIN_D = 24*60, MIN_M = 30*24*60;
  const months = Math.floor(totalMin / MIN_M); let rest = totalMin - months*MIN_M;
  const days = Math.floor(rest / MIN_D); rest -= days*MIN_D;
  const hours = Math.floor(rest / 60); const mins = rest - hours*60;
  const parts = [];
  if(months) parts.push(months+' '+(months===1?'mes':'meses'));
  if(days) parts.push(days+' '+(days===1?'día':'días'));
  if(hours) parts.push(hours+' h');

  const totalMovies = movies.length, movVistas = movies.filter(m=>m.watched).length, movPend = totalMovies-movVistas;
  const totalBooks = books.length, bookLeidos = books.filter(b=>b.watched).length, bookPend = totalBooks-bookLeidos;

  const hourBuckets={Mañana:0,Tarde:0,Noche:0,Madrugada:0};
  events.forEach(e=>{
    const h=new Date(e.watchedAt).getHours();
    if(h>=6&&h<12) hourBuckets.Mañana++; else if(h>=12&&h<20) hourBuckets.Tarde++; else if(h>=20&&h<24) hourBuckets.Noche++; else hourBuckets.Madrugada++;
  });
  const weekdayNames=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const maxHour = Math.max(...Object.values(hourBuckets),1);

  // Últimos 7 días: si hoy es viernes, empieza el viernes pasado y acaba el jueves (ayer)
  const allSeriesEvents = seriesWatchedEvents(0);
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const weekRows = [];
  for(let i=7;i>=1;i--){
    const d0 = new Date(todayStart); d0.setDate(d0.getDate()-i);
    const d1 = new Date(d0); d1.setDate(d1.getDate()+1);
    const mins = allSeriesEvents.filter(e=>e.watchedAt>=d0.getTime() && e.watchedAt<d1.getTime()).reduce((a,e)=>a+e.minutes,0);
    weekRows.push({name:weekdayNames[d0.getDay()], mins});
  }
  const weekFrom = weekRows[0].name.toLowerCase(), weekTo = weekRows[6].name.toLowerCase();
  const monthNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const sumBetween = (d0,d1)=> allSeriesEvents.filter(e=>e.watchedAt>=d0.getTime() && e.watchedAt<d1.getTime()).reduce((a,e)=>a+e.minutes,0);
  const dayCols = weekRows.map(r=>[r.name.slice(0,3), r.mins, false]);
  // Últimas 4 semanas (lunes a domingo; la última es la semana en curso)
  const mondayThis = new Date(todayStart); mondayThis.setDate(mondayThis.getDate() - ((todayStart.getDay()+6)%7));
  const weekCols = [];
  for(let i=3;i>=0;i--){
    const d0 = new Date(mondayThis); d0.setDate(d0.getDate()-7*i);
    const d1 = new Date(d0); d1.setDate(d1.getDate()+7);
    weekCols.push([d0.getDate()+' '+monthNames[d0.getMonth()].toLowerCase(), sumBetween(d0,d1), i===0]);
  }
  // Últimos 6 meses (el último es el mes en curso)
  const monthCols = [];
  for(let i=5;i>=0;i--){
    const d0 = new Date(todayStart.getFullYear(), todayStart.getMonth()-i, 1);
    const d1 = new Date(todayStart.getFullYear(), todayStart.getMonth()-i+1, 1);
    monthCols.push([monthNames[d0.getMonth()], sumBetween(d0,d1), i===0]);
  }
  // Últimos 5 años (el último es el año en curso)
  const yearCols = [];
  for(let i=4;i>=0;i--){
    const y = todayStart.getFullYear()-i;
    yearCols.push([String(y), sumBetween(new Date(y,0,1), new Date(y+1,0,1)), i===0]);
  }

  const viendoList = viendoOrdered();
  const forecasts = viendoList.map(s=>({s,f:forecastFor(s)}));
  const totalEpsLeft = forecasts.reduce((a,x)=>a+x.f.episodesRemaining,0);
  let jointMinutesWatched=0, jointMinutesRemaining=0;
  const cut6 = Date.now()-182*86400000;
  series.forEach(s=>{
    jointMinutesWatched += flatEpisodes(s).filter(e=>e.watched && e.watchedAt && e.watchedAt>=cut6).reduce((a,e)=>a+(e.runtime||30),0);
  });
  viendoList.forEach(s=>{
    jointMinutesRemaining += airedEpisodes(s).filter(e=>!e.watched).reduce((a,e)=>a+(e.runtime||30),0);
  });
  const jointForecast = jointMinutesWatched>0 ? jointMinutesRemaining/(jointMinutesWatched/182) : null;

  let html = `<div class="profile-head"><div class="avatar" id="avatarBtn">${profile.avatar? esc(profile.avatar) : esc((profile.name||'?')[0].toUpperCase())}</div>
    <div><div class="profile-name" id="nameBtn">${esc(profile.name)}</div><div style="font-size:0.68rem;color:var(--ink-soft);">Toca para editar</div></div></div>`;

  html += `<div class="period-row">${Object.keys(PERIODS).map(p=>`<button class="period-chip ${statPeriod===p?'active':''}" data-p="${p}">${PERIOD_LABELS[p]}</button>`).join('')}</div>`;

  html += `<div class="stat-card"><div class="label">Series</div><div class="value">${totalSeries}</div><div class="subvalue">${curso} en curso · ${sinComenzar} sin comenzar · ${fin} finalizadas</div></div>`;
  html += `<div class="stat-card"><div class="label">Pelis</div><div class="value">${totalMovies}</div><div class="subvalue">${movVistas} vistas · ${movPend} pendientes</div></div>`;
  html += `<div class="stat-card"><div class="label">Biblioteca</div><div class="value">${totalBooks}</div><div class="subvalue">${bookLeidos} leídos · ${bookPend} pendientes</div></div>`;
  html += `<div class="stat-card"><div class="label">Horas vistas · series (${PERIOD_LABELS[statPeriod].toLowerCase()})</div><div class="value">${fmtDurationMin(hoursMinutes)}</div><div class="subvalue">${hoursCount} capítulo${hoursCount===1?'':'s'}${undatedEvents.length? ' · '+undatedEvents.length+' sin fecha':''}</div></div>`;

  html += `<div class="section-label">Horas vistas por periodo · series</div>`;
  html += vChart('Últimos 7 días', `Del ${weekFrom} pasado al ${weekTo}`, dayCols, fmtCompact);
  html += vChart('Últimas 4 semanas', 'Semanas de lunes a domingo', weekCols, fmtCompact);
  html += vChart('Últimos 6 meses', '', monthCols, fmtHoursOnly);
  html += vChart('Últimos 5 años', '', yearCols, fmtHoursOnly);
  html += `<div class="chart-note">Las barras rayadas son el periodo en curso, aún sin terminar.</div>`;

  html += `<div class="stat-card"><div class="label">Franja horaria</div>`;
  Object.entries(hourBuckets).forEach(([k,v])=>{ html += `<div class="bar-row"><span class="lbl">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${v/maxHour*100}%"></div></div></div>`; });
  html += `</div>`;

  html += `<div class="section-label">Plataformas y géneros (${PERIOD_LABELS[statPeriod].toLowerCase()})</div>`;
  if(enrichRunning) html += `<div class="chart-note">Completando datos de ${enrichPending>0?enrichPending:'tus'} títulos…</div>`;
  html += pieCard('Plataformas · series', 'Series con capítulos vistos, según la plataforma donde están hoy en España', platformCounts(cutoff));
  html += pieCard('Géneros vistos · series y pelis', 'Cada título cuenta en todos sus géneros', genreCounts(cutoff));

  html += `<div class="section-label">Maratones · últimos 6 meses</div>`;
  html += marathonCard();
  html += `<div class="chart-note">Mayor tiempo visto de cada serie en cualquier periodo de 24 horas. Los capítulos marcados de golpe con una fecha cuentan como vistos seguidos.</div>`;

  html += `<div class="section-label">Previsión (últimos 6 meses, fija)</div>`;
  html += `<div class="stat-card"><div class="label">Todas las series que estoy viendo</div><div class="value">${jointForecast!==null? endDateStr(jointForecast) : 'Sin datos suficientes'}</div><div class="subvalue">${totalEpsLeft} capítulo${totalEpsLeft===1?'':'s'} restante${totalEpsLeft===1?'':'s'}</div><div class="subvalue">${fmtFull(jointMinutesRemaining)} restantes</div></div>`;
  if(forecasts.length){
    html += `<div class="stat-card">` + forecasts.map(({s,f})=>{
      const n = f.episodesRemaining;
      const subTxt = n+' capítulo'+(n===1?'':'s')+' restante'+(n===1?'':'s');
      return `<div class="forecast-item"><div class="fc-left"><b>${esc(s.title)}</b><div class="fc-sub">${subTxt}</div><div class="fc-sub">${fmtFull(f.minutesRemaining)} restantes</div></div><div class="fc-right${f.days===null?' nodata':''}">${f.days!==null? endDateStr(f.days) : 'Sin datos suficientes'}</div></div>`;
    }).join('') + `</div>`;
  }

  html += `<div class="section-label">Copia de seguridad</div>`;
  html += `<div class="stat-card"><div class="label">Espacio usado</div><div class="value">${storageUsageKB()} KB</div><div class="subvalue">Guardado con bastante margen disponible en tu móvil.</div></div>`;
  html += `<div class="stat-card">
    <div class="subvalue" style="margin-bottom:0.6rem;">Descarga tus datos para pasarlos a otro móvil, o carga una copia anterior.</div>
    <button class="add-cta" id="exportBtn" style="margin-top:0;">Exportar datos</button>
    <button class="add-cta" id="importBtn" style="margin-top:0.5rem;background:transparent;border:1px solid var(--ink);color:var(--ink);">Importar datos</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>`;

  main.innerHTML = html;
  document.querySelectorAll('.period-chip').forEach(b=>b.addEventListener('click', ()=>{ statPeriod=b.dataset.p; renderPerfil(); }));
  document.getElementById('avatarBtn').addEventListener('click', editProfile);
  document.getElementById('nameBtn').addEventListener('click', editProfile);
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importData);
}
function exportData(){
  const payload = { series, movies, books, profile, settings, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'culturicidio-datos-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm('Esto sustituirá todos tus datos actuales por los del archivo. ¿Continuar?')) return;
      series = data.series || [];
      movies = data.movies || [];
      books = data.books || [];
      profile = data.profile || profile;
      settings = data.settings || settings;
      recomputeAll();
      await saveSeries(); await saveMovies(); await saveBooks(); await saveProfile(); await saveSettings();
      render();
    }catch(e){ alert('No se pudo leer el archivo. Comprueba que es una copia exportada desde Culturicidio.'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}
function editProfile(){
  const html = `<button class="sheet-close">&times;</button>
    <h2>Editar perfil</h2>
    <div class="field"><label>Nombre</label><input id="pfName" value="${esc(profile.name)}"></div>
    <div class="field"><label>Avatar (una letra o emoji)</label><input id="pfAvatar" value="${esc(profile.avatar)}" maxlength="2"></div>
    <div class="field"><label>Clave TMDB</label><input id="pfKey" value="${esc(settings.tmdbKey)}"></div>
    <div class="modal-actions"><button class="primary" id="pfSave">Guardar</button></div>`;
  openSheet(html);
  document.getElementById('pfSave').addEventListener('click', async ()=>{
    profile.name = document.getElementById('pfName').value.trim()||'Tu perfil';
    profile.avatar = document.getElementById('pfAvatar').value.trim();
    settings.tmdbKey = document.getElementById('pfKey').value.trim();
    await saveProfile(); await saveSettings();
    closeSheet(); renderPerfil();
  });
}

/* ---------------- MANUAL ADD ---------------- */
function openManualAdd(){
  const kind = activeTab; // 'series' | 'pelis' | 'biblioteca'
  const labelMap = {series:'serie', pelis:'peli', biblioteca:'libro o revista'};
  const html = `<button class="sheet-close">&times;</button>
    <h2>Añadir ${labelMap[kind]} manualmente</h2>
    <div class="field"><label>Título</label><input id="maTitle"><div class="err" id="maErr">Escribe un título</div></div>
    ${kind==='biblioteca' ? `<div class="field"><label>Autor</label><input id="maAuthor"></div>` : `<div class="field"><label>Fecha de estreno</label><input id="maDate" type="date"></div>`}
    <div class="field"><label>${kind==='biblioteca'?'Páginas':`Duración (minutos por ${kind==='series'?'capítulo':'película'})`}</label><input id="maDur" type="number" value="${kind==='series'?30:kind==='pelis'?100:250}"></div>
    <div class="field"><label>Sinopsis</label><textarea id="maOverview"></textarea></div>
    <div class="modal-actions"><button id="maCancel">Cancelar</button><button class="primary" id="maSave">Añadir</button></div>`;
  openSheet(html);
  document.getElementById('maCancel').addEventListener('click', closeSheet);
  document.getElementById('maSave').addEventListener('click', async ()=>{
    const title = document.getElementById('maTitle').value.trim();
    if(!title){ document.getElementById('maErr').style.display='block'; return; }
    const dur = parseInt(document.getElementById('maDur').value)||30;
    const overview = document.getElementById('maOverview').value.trim();
    if(kind==='series'){
      const date = document.getElementById('maDate').value || todayISO();
      series.push({ id:uid('s_'), tmdbId:null, title, poster:'', overview, cast:[], tmdb_status:'', addedAt:Date.now(), pinned:false, _wasFinalizada:false,
        seasons:[{season_number:1, episodes:[{episode_number:1,name:'',overview:'',air_date:date,runtime:dur,watched:false,watchedAt:null}]}] });
      recomputeAll(); await saveSeries();
    } else if(kind==='pelis'){
      const date = document.getElementById('maDate').value || todayISO();
      movies.push({ id:uid('m_'), tmdbId:null, title, poster:'', overview, cast:[], releaseDate:date, runtime:dur, watched:false, watchedAt:null, addedAt:Date.now() });
      await saveMovies();
    } else {
      const author = document.getElementById('maAuthor').value.trim();
      books.push({ id:uid('b_'), gbId:null, title, author, cover:'', overview, pages:dur, publishedDate:'', watched:false, watchedAt:null, addedAt:Date.now() });
      await saveBooks();
    }
    closeSheet(); render();
  });
}

/* ---------------- NAV / INIT ---------------- */
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click', ()=>{
  activeTab=b.dataset.tab;
  window.scrollTo(0,0);
  lastScrollY = 0;
  document.getElementById('topbar').style.transform = 'translate(-50%, 0)';
  document.getElementById('bottomnav').style.transform = 'translate(-50%, 0)';
  const fab = document.getElementById('fabAdd'); if(fab) fab.style.transform = 'translateY(0)';
  render();
}));
document.getElementById('fabAdd').addEventListener('click', openManualAdd);
document.getElementById('overlay').addEventListener('click', (ev)=>{ if(ev.target.id==='overlay') closeSheet(); });

let lastScrollY = 0;
function showBottom(){
  const nav = document.getElementById('bottomnav'); const fab = document.getElementById('fabAdd');
  nav.style.transform = 'translate(-50%, 0)'; if(fab) fab.style.transform='translateY(0)';
}
function hideBottom(){
  const nav = document.getElementById('bottomnav'); const fab = document.getElementById('fabAdd');
  nav.style.transform = 'translate(-50%, 100%)'; if(fab) fab.style.transform='translateY(100px)';
}
let touchStartY = null;
window.addEventListener('touchstart', (e)=>{ touchStartY = e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchmove', (e)=>{
  if(touchStartY===null) return;
  const y = e.touches[0].clientY;
  const dy = y - touchStartY;
  if(window.scrollY <= 2){ showBottom(); touchStartY = y; return; }
  if(dy < -3){ hideBottom(); touchStartY = y; }
  else if(dy > 3){ showBottom(); touchStartY = y; }
}, {passive:true});
window.addEventListener('touchend', ()=>{ touchStartY = null; });
window.addEventListener('wheel', (e)=>{
  if(window.scrollY <= 2){ showBottom(); return; }
  if(e.deltaY > 0) hideBottom();
  else if(e.deltaY < 0) showBottom();
}, {passive:true});
window.addEventListener('scroll', ()=>{
  if(window.scrollY <= 2) showBottom();
  lastScrollY = window.scrollY;
}, { passive:true });

loadAll();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
